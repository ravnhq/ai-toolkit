name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  pull_request:
    paths:
      - "docs/**"
      - "test/feed_generation_test.rb"
      - ".github/workflows/pages.yml"
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "test/feed_generation_test.rb"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.10'
          bundler-cache: true
          working-directory: docs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        run: bundle exec jekyll build --source docs --destination _site
        env:
          JEKYLL_ENV: production
      - name: Validate feed output
        run: |
          test -f _site/feed.xml
          grep -q "<feed" _site/feed.xml
          grep -q "Keep Your Context Window Clean" _site/feed.xml
          grep -q "application/atom+xml" _site/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
