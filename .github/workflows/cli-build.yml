name: CLI Build

on:
  push:
    branches: ["main"]
    paths:
      - "cli-ts/**"
      - "scripts/sign-macos.sh"
      - ".github/workflows/cli-build.yml"
  workflow_dispatch:

permissions:
  contents: write

# Serialize builds so overlapping main pushes don't race the cli-latest
# tag force-push and release create/delete. Don't cancel an in-flight
# release mid-publish.
concurrency:
  group: cli-build
  cancel-in-progress: false

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: cli-ts
        run: bun install --frozen-lockfile

      - name: Build Linux binaries
        working-directory: cli-ts
        run: |
          mkdir -p dist-bin
          for target in bun-linux-x64 bun-linux-arm64; do
            platform="${target#bun-}"
            outfile="dist-bin/corvus-${platform}"
            echo "  Building ${platform}..."
            bun build src/index.ts --compile --target="$target" --outfile="$outfile"
            echo "  ✓ ${outfile}"
          done

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: corvus-linux
          path: cli-ts/dist-bin/corvus-linux-*
          retention-days: 1

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: cli-ts
        run: bun install --frozen-lockfile

      - name: Build macOS binaries
        working-directory: cli-ts
        run: |
          mkdir -p dist-bin
          for target in bun-darwin-arm64 bun-darwin-x64; do
            platform="${target#bun-}"
            outfile="dist-bin/corvus-${platform}"
            echo "  Building ${platform}..."
            bun build src/index.ts --compile --target="$target" --outfile="$outfile"
            # Bun emits a malformed LC_CODE_SIGNATURE stub; sign-macos.sh strips
            # it and applies an ad-hoc signature. `codesign -dv` verifies the
            # result so the build can't silently ship an unsigned arm64 binary
            # that the macOS kernel refuses to exec.
            ../scripts/sign-macos.sh "$outfile"
            codesign -dv "$outfile"
            echo "  ✓ ${outfile}"
          done

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: corvus-macos
          path: cli-ts/dist-bin/corvus-darwin-*
          retention-days: 1

  publish:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-bin
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete cli-latest --yes 2>/dev/null || true
          git tag -f cli-latest
          git push -f origin cli-latest
          gh release create cli-latest dist-bin/corvus-* \
            --title "corvus latest" \
            --notes "Latest build from main" \
            --latest
